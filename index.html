    // --- Line Message and Contact Logic (Retained) ---
    function sendLineMessage(openChat = false, manualContactInfo = null, manualAddress = null, manualTotal = null, manualNotes = null) {
        const contactInfo = manualContactInfo !== null ? manualContactInfo : 'ไม่ระบุช่องทางติดต่อ'; 

        const data = lastCommittedOrder || { 
            id: 'PENDING',
            items: currentOrder,
            total: manualTotal !== null ? manualTotal : currentOrder.reduce((sum, item) => sum + item.price * item.quantity, 0),
            contactInfo: contactInfo,
            address: manualAddress !== null ? manualAddress : (modalDeliveryAddressInput.value.trim() || 'รับเองที่ร้าน'), 
            notes: manualNotes !== null ? manualNotes : modalOrderNotesInput.value.trim()
        };
        
        const itemsSummary = data.items.map(item => {
            let summary = `${item.name} (${item.size}, หวาน ${item.sweetness})`;
            // *** UPDATED: Logic การแสดงไข่มุกใน Line ***
            if (item.hasBubble) {
                summary += item.addBubble ? ' + ไข่มุก' : ' - ไม่รับไข่มุก';
            }
            return `${summary} x${item.quantity}`;
        }).join(', ');
        
        const message = 
            `🐄 *วัวนม* #${data.id.substring(0, 8)}:\n` +
            `รายการ: ${itemsSummary}\n` +
            `รวม: ฿${data.total.toLocaleString('th-TH')}\n` +
            `ติดต่อ: ${data.contactInfo}\n` +
            `ที่อยู่: ${data.address}\n` +
            (data.notes && data.notes.trim() !== '' ? `หมายเหตุ: ${data.notes}\n` : '') +
            `--- สำเร็จ`;

        const encodedMessage = encodeURIComponent(message);
        
        const firestoreLineUrl = `${LINE_LINK}?text=${encodedMessage}`;
        const customerLineSchemeUrl = `${LINE_LINK}?text=${encodedMessage}`; 
        
        if (openChat) {
            window.open(customerLineSchemeUrl, '_blank');
            alert("โปรดกด 'ส่ง' ใน Line Chat (หรือแชร์ไปยัง Line) เพื่อยืนยันการสั่งซื้อกับร้านค้า");
        }
        
        return firestoreLineUrl;
    }

    function copyAndOpenLine(orderId, contactLink, buttonText) {
        const shortOrderId = `#${orderId.substring(0, 8)}`; 
        
        const copyPromise = navigator.clipboard && navigator.clipboard.writeText
            ? navigator.clipboard.writeText(shortOrderId).then(() => {
                console.log(`Copied Order ID: ${shortOrderId}`);
                if (buttonText !== '📞 โทรออก') {
                    alert(`คัดลอกเลขออเดอร์ ${shortOrderId} แล้ว! (โปรดวางในช่องค้นหา Line)`);
                }
            }).catch(err => {
                console.error('Could not copy text: ', err);
                alert(`ไม่สามารถคัดลอกเลขออเดอร์ ${shortOrderId} ได้ (กรุณาจด/คัดลอกด้วยตนเอง)`);
            })
            : new Promise(resolve => {
                alert(`เบราว์เซอร์ไม่รองรับการคัดลอกอัตโนมัติ (กรุณาจดเลขออเดอร์: ${shortOrderId})`);
                resolve();
            });

        copyPromise.finally(() => {
            setTimeout(() => {
                window.open(contactLink, '_blank');
            }, 200); 
        });
    }

    function isToday(date) {
        const today = new Date();
        return date.getDate() === today.getDate() && date.getMonth() === today.getMonth() && date.getFullYear() === today.getFullYear();
    }
    
    // 🔥 Firebase Realtime Listeners 🔥
    function initFirebaseListeners() {
        db.collection("orders") 
            .orderBy("status", "asc") 
            .orderBy("placedAt", "asc") 
            .onSnapshot(snapshot => { 
                orderQueue = snapshot.docs.map(doc => ({ 
                    id: doc.id, 
                    ...doc.data() 
                }));
                
                const currentQueueLength = orderQueue.filter(order => order.status === 'คิว').length;
                
                if (lastQueueLength > 0 && currentQueueLength > lastQueueLength) {
                    if (isOwnerLoggedIn && notificationSound) {
                        notificationSound.play().catch(e => console.log('Autoplay blocked:', e));
                    }
                }
                
                lastQueueLength = currentQueueLength;
                
                renderOrderQueue();
                updateQueueTracker(); 
            }, error => {
                console.error("Firebase Order Listener Error:", error);
                document.getElementById('order-queue').innerHTML = '<p class="text-red-500 text-center mt-4 font-bold">⚠️ ERROR: ไม่สามารถเชื่อมต่อฐานข้อมูลได้</p>';
            });

        db.collection("salesLog").onSnapshot(snapshot => {
            menuSalesLog = snapshot.docs.map(doc => doc.data());
            updateSalesDashboard(); 
        }, error => {
            console.error("Firebase Sales Listener Error:", error);
        });
        
        auth.onAuthStateChanged(handleAuthChange);
    }

    /**
     * UPDATED: Updates the queue count badge and cart badge.
     */
    function updateQueueTracker() {
        const queueCount = orderQueue.filter(order => order.status === 'คิว').length;
        const doingCount = orderQueue.filter(order => order.status === 'กำลังทำ').length;
        const overallQueueCount = queueCount + doingCount;
        
        // Update the Queue Badge
        queueOverallCountEl.textContent = overallQueueCount;
        if (overallQueueCount > 0) {
            queueOverallCountEl.classList.remove('hidden');
        } else {
            queueOverallCountEl.classList.add('hidden');
        }

        // Update the Cart Badge based on currentOrder (Total Quantity)
        const totalItemsInCart = currentOrder.reduce((sum, item) => sum + item.quantity, 0);
        cartItemCountEl.textContent = totalItemsInCart;
        if (totalItemsInCart > 0) {
            cartItemCountEl.classList.remove('hidden');
        } else {
            cartItemCountEl.classList.add('hidden');
        }


        // Update the detailed tracker bar (only visible in queue-section for owner)
        queueCountQueueEl.textContent = queueCount;
        queueCountDoingEl.textContent = doingCount;
        
        if (isOwnerLoggedIn) {
            salesDashboardContainer.style.display = 'flex'; 
        } else {
            salesDashboardContainer.style.display = 'none';
        }
    }

    function createMenuItemButton(item, size, price, colorClass) {
        let sizeLabel = size;
        
        if (size.includes('Oz.')) {
            sizeLabel = size.replace('Oz.', ' ออนซ์');
            const hasOther16Oz = item.prices['16 Oz. ปั่น'] || item.prices['16 Oz. เย็น'];
            const has22OzOptions = item.prices['22 Oz. เย็น'] || item.prices['22 Oz. ปั่น'];

            if (size === '16 Oz.' && (hasOther16Oz || has22OzOptions)) {
                sizeLabel = '16 ออนซ์ เย็น';
            }
            
            if (size.includes('เย็น')) {
                sizeLabel = sizeLabel.replace(' เย็น', ' เย็น'); 
            } else if (size.includes('ปั่น')) {
                sizeLabel = sizeLabel.replace(' ปั่น', ' ปั่น'); 
            }

            sizeLabel = sizeLabel.replace(/\s\s+/g, ' ').trim();
            
        }
        else if (size === 'เย็น' || size === 'ปั่น') {
            sizeLabel = size;
        }

        const menuItem = document.createElement('div');
        menuItem.className = `main-menu-card bg-white hover:bg-gray-100 border border-gray-200`; 
        // NOTE: pass item.hasBubble to addToOrder
        menuItem.setAttribute('onclick', `addToOrder(${item.id}, '${size.replace(/'/g, "\\'")}', ${price}, ${item.hasBubble})`);

        let imageHtml = '';
        if (item.imageUrl) {
             imageHtml = `<img src="${item.imageUrl}" alt="${item.name} image" class="menu-image">`;
        } else {
             imageHtml = `<div class="menu-image flex items-center justify-center text-xs text-gray-400 bg-gray-100">ไม่มีรูปภาพ</div>`;
        }
        
        const uploadBtnHtml = `<span class="upload-img-btn text-xs" style="display: none;" onclick="event.stopPropagation(); showImageUploadModal(${item.id}, '${item.name}', '${size.replace(/'/g, "\\'")}', ${price})">📷</span>`;

        menuItem.innerHTML = `
            ${uploadBtnHtml}
            ${imageHtml}
            <p class="menu-name">${item.name}</p>
            <p class="text-gray-500 text-xs">${sizeLabel}</p>
            <p class="menu-price-tag text-teal-600">฿${price.toLocaleString('th-TH')}</p>
        `;
        return menuItem;
    }

    // 🔥 UPDATED: addToOrder (รับ hasBubble เข้ามา) 🔥
    function addToOrder(itemId, size = null, price = null, hasBubble = false) {
        const item = getItemDataById(itemId);
        if (!item) return;

        let finalSize = size;
        let finalPrice = price;

        if (finalSize === null || finalPrice === null) {
            const defaultSize = Object.keys(item.prices)[0];
            finalSize = defaultSize;
            finalPrice = item.prices[defaultSize];
        }

        const defaultSweetness = sweetnessOptions[0];
        const defaultAddBubble = hasBubble; // Default: รับไข่มุกถ้าเมนูมี

        const orderItem = {
            id: Date.now(),
            itemId: item.id,
            name: item.name,
            size: finalSize, 
            price: finalPrice, 
            quantity: 1,
            sweetness: defaultSweetness,
            hasBubble: hasBubble, // บอกว่าเมนูนี้มีตัวเลือกไข่มุก
            addBubble: defaultAddBubble, // ลูกค้าเลือกรับหรือไม่
        };
        
        // ตรวจสอบรายการที่มีอยู่ โดยดูจาก size, sweetness, และ addBubble
        const existingItemIndex = currentOrder.findIndex(
            i => i.itemId === item.id && i.size === finalSize && i.sweetness === defaultSweetness && i.addBubble === defaultAddBubble
        );

        if (existingItemIndex !== -1) {
            currentOrder[existingItemIndex].quantity += 1;
        } else {
            currentOrder.push(orderItem);
        }
        
        updateQueueTracker(); 
    }

     */
    function renderCurrentOrderModal() {

        const totalPriceEl = document.getElementById('modal-total-price');
        const submitOrderBtn = document.getElementById('modal-submit-order-btn');
        
        if (currentOrder.length === 0) {
            currentOrderItemsEl.innerHTML = '<p class="text-gray-400 text-center mt-2 text-sm">เลือกเมนูจากด้านซ้ายเพื่อเริ่ม...</p>';
            submitOrderBtn.disabled = true;
        } else {
            // NOTE: การ render ใหม่ทั้งหมดที่นี่อาจทำให้เกิดการกระพริบเล็กน้อยเมื่อมีการแยกรายการ
            // แต่จะทำให้การจัดการ state ง่ายขึ้นเมื่อมีการแยกรายการ (quantity > 1)
            currentOrderItemsEl.innerHTML = ''; 
            currentOrder.forEach(item => {
                const menuItem = getItemDataById(item.itemId);
                const availableSizes = Object.keys(menuItem.prices);

                const sizeOptions = availableSizes.map(size => `<option value="${size}" ${item.size === size ? 'selected' : ''}>${size}</option>`).join('');
                const sweetnessDropdown = sweetnessOptions.map(level => `<option value="${level}" ${item.sweetness === level ? 'selected' : ''}>${level}</option>`).join('');
                
                // NEW: สร้าง Dropdown สำหรับไข่มุก
                let bubbleDropdown = '';
                if (item.hasBubble) {
                    const bubbleOptionsHtml = `
                        <option value="true" ${item.addBubble ? 'selected' : ''}>ใส่ไข่มุก</option>
                        <option value="false" ${!item.addBubble ? 'selected' : ''}>ไม่ใส่ไข่มุก</option>
                    `;
                    bubbleDropdown = `
                        <div class="flex flex-col">

                            <select class="text-xs p-1 border rounded" onchange="updateOrderItemBubble(${item.id}, this.value === 'true')">${bubbleOptionsHtml}</select>

    /**
     * **OPTIMIZED:** ฟังก์ชันอัปเดตยอดรวมใน Modal (รันบ่อย)
     */
    function updateModalTotalPrice() {
        const total = currentOrder.reduce((sum, item) => sum + item.price * item.quantity, 0);
        document.getElementById('modal-total-price').textContent = `฿${total.toLocaleString('th-TH')}`;
    }
    
    /**
     * **OPTIMIZED:** ฟังก์ชันอัปเดตปริมาณ (รันบ่อย)
     */
    function updateOrderItemQuantity(orderItemId, change) {
        const orderItemIndex = currentOrder.findIndex(item => item.id === orderItemId);
        if (orderItemIndex === -1) return;
        const orderItem = currentOrder[orderItemIndex];

        if (orderItem.quantity + change > 0) {
            orderItem.quantity += change;

            // 1. In-place DOM update: อัปเดต Quantity และ Total Price ของ Element นั้น
            const itemEl = document.querySelector(`#modal-current-order-items div[data-order-item-id="${orderItemId}"]`);
            if (itemEl) {
                itemEl.querySelector('[data-item-quantity]').textContent = orderItem.quantity;
                itemEl.querySelector('[data-item-total]').textContent = `฿${(orderItem.price * orderItem.quantity).toLocaleString('th-TH')}`;
            }
        } else if (orderItem.quantity + change === 0) {
            removeOrderItem(orderItemId); 
            return;
        }
        
        // 2. อัปเดตยอดรวมและ Badge
        updateModalTotalPrice(); 
        updateQueueTracker(); 
    }

    /**
     * **UPDATED:** ฟังก์ชันอัปเดตความหวาน (สร้าง Item ใหม่ถ้าปริมาณ > 1)
     */
    function updateOrderItemSweetness(orderItemId, newSweetness) {
        const orderItem = currentOrder.find(item => item.id === orderItemId);
        if (!orderItem) return;
        
        if (orderItem.sweetness !== newSweetness) {
            if (orderItem.quantity > 1) {
                orderItem.quantity -= 1;
                // NEW: ต้องรวม addBubble ใน newItem ด้วย
                const newItem = {...orderItem, id: Date.now(), sweetness: newSweetness, quantity: 1, addBubble: orderItem.addBubble};
                currentOrder.push(newItem);
                
                // หากมีการแยกรายการ ให้สร้างรายการ Modal ใหม่ทั้งหมดเพื่อแสดงผล (ยอมให้กระตุกครั้งเดียว)
                renderCurrentOrderModal(); 
            } else {
                orderItem.sweetness = newSweetness;
                // หากเป็นการเปลี่ยนความหวานของรายการเดียว ไม่ต้อง render ใหม่ทั้งหมด
                updateModalTotalPrice(); 
            }
        }
        updateQueueTracker(); 
    }
    
    /**
     * **NEW:** ฟังก์ชันอัปเดตไข่มุก (สร้าง Item ใหม่ถ้าปริมาณ > 1)
     */
    function updateOrderItemBubble(orderItemId, newBubbleStatus) {
        const orderItem = currentOrder.find(item => item.id === orderItemId);
        if (!orderItem) return;
        
        // แปลง boolean เป็น boolean จริงๆ ก่อนเปรียบเทียบ
        const actualNewBubbleStatus = newBubbleStatus === true; 

        if (orderItem.addBubble !== actualNewBubbleStatus) {
            if (orderItem.quantity > 1) {
                orderItem.quantity -= 1;
                // NEW: สร้าง Item ใหม่โดยเปลี่ยนแค่ addBubble
                const newItem = {...orderItem, id: Date.now(), addBubble: actualNewBubbleStatus, quantity: 1};
                currentOrder.push(newItem);
                
                // หากมีการแยกรายการ ให้สร้างรายการ Modal ใหม่ทั้งหมดเพื่อแสดงผล
                renderCurrentOrderModal(); 
            } else {
                orderItem.addBubble = actualNewBubbleStatus;
                // หากเป็นการเปลี่ยนไข่มุกของรายการเดียว ไม่ต้อง render ใหม่ทั้งหมด
                updateModalTotalPrice(); 
            }
        }
        updateQueueTracker(); 
    }
    
    /**
     * **UPDATED:** ฟังก์ชันอัปเดตขนาด (สร้าง Item ใหม่ถ้าปริมาณ > 1)
     */
    function updateOrderItemSize(orderItemId, newSize) {
        const orderItem = currentOrder.find(item => item.id === orderItemId);
        const menuItem = getItemDataById(orderItem.itemId);
        if (!orderItem || menuItem.prices[newSize] === undefined) return;
        
        if (orderItem.size !== newSize) {
            const newPrice = menuItem.prices[newSize];
            
            if (orderItem.quantity > 1) {
                orderItem.quantity -= 1;
                 // NEW: ต้องรวม addBubble ใน newItem ด้วย
                const newItem = {...orderItem, id: Date.now(), size: newSize, price: newPrice, quantity: 1, addBubble: orderItem.addBubble};
                currentOrder.push(newItem);
                
                // หากมีการแยกรายการ ให้สร้างรายการ Modal ใหม่ทั้งหมดเพื่อแสดงผล (ยอมให้กระตุกครั้งเดียว)
                renderCurrentOrderModal(); 
            } else {
                orderItem.size = newSize;
                orderItem.price = newPrice;
                
                // หากเป็นการเปลี่ยนขนาดของรายการเดียว
                const itemEl = document.querySelector(`#modal-current-order-items div[data-order-item-id="${orderItemId}"]`);
                if (itemEl) {
                    itemEl.querySelector('[data-item-total]').textContent = `฿${(orderItem.price * orderItem.quantity).toLocaleString('th-TH')}`;
                }
                updateModalTotalPrice(); 
            }
        }
        updateQueueTracker(); 
    }
    
    /**
     * **OPTIMIZED:** ฟังก์ชันลบรายการ (ลบ Element ตรงๆ)
     */
    function removeOrderItem(orderItemId) {
        currentOrder = currentOrder.filter(item => item.id !== orderItemId);
        
        // 1. In-place DOM removal
        const itemEl = document.querySelector(`#modal-current-order-items div[data-order-item-id="${orderItemId}"]`);
        if (itemEl) {
            itemEl.remove(); // ใช้ itemEl.remove()
        }
        
        // 2. ถ้าตะกร้าว่าง ให้ render Modal ใหม่เพื่อแสดงข้อความ "ไม่มีรายการ"
        if (currentOrder.length === 0) {
             renderCurrentOrderModal();
        }
        
        updateModalTotalPrice(); 
        updateQueueTracker(); 
    }
    
    // 🔥 UPDATED: Submit Order (ส่งข้อมูล addBubble ไปด้วย) 🔥
    modalSubmitOrderBtn.addEventListener('click', () => {
        const orderTotal = currentOrder.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const address = modalDeliveryAddressInput.value.trim(); 
        const notes = modalOrderNotesInput.value.trim(); 
        
        if (currentOrder.length === 0) {
             alert("กรุณาเลือกเมนูอย่างน้อย 1 รายการก่อนส่งออเดอร์");
             return; 
        }
        
        const contactInfo = 'ไม่ระบุช่องทางติดต่อ'; 
        const contactLineURL = sendLineMessage(false, contactInfo, address || 'รับเองที่ร้าน', orderTotal, notes); 
        
        db.collection("orders").add({ 
            items: currentOrder.map(item => ({
                ...item,
                // ตัด id ชั่วคราวออก และรวม addBubble
                id: undefined, 
                addBubble: item.addBubble 
            })),
            total: orderTotal,
            contactInfo: contactInfo, 
            contactLineURL: contactLineURL,
            address: address || 'รับเองที่ร้าน',
            notes: notes, 
            status: 'คิว',
            placedAt: firebase.firestore.FieldValue.serverTimestamp(), 
            sourceTag: orderSourceTag 
        })
        .then(docRef => {
            lastCommittedOrder = {
                 id: docRef.id, 
                 items: [...currentOrder],
                 total: orderTotal,
                 contactInfo: contactInfo, 
                 address: address || 'รับเองที่ร้าน',
                 notes: notes, 
                 sourceTag: orderSourceTag,
                 contactLineURL: contactLineURL 
            };
            
            // Clear state
            currentOrder = []; 
            modalDeliveryAddressInput.value = '';
            modalOrderNotesInput.value = ''; 
            
            closeOrderEntryModal(); 
            updateQueueTracker(); 
            showPaymentQRModal(orderTotal);
        })
        .catch(error => {
            console.error("Error adding document: ", error);
            alert("ไม่สามารถส่งออเดอร์ได้ กรุณาลองใหม่");
        });
    });

    // --- Queue and Sales Logic (Retained) ---
    function renderOrderQueue() {
        const displayQueue = orderQueue.filter(order => order.status !== 'เสร็จแล้ว' && order.status !== 'ยกเลิก');

        if (displayQueue.length === 0) {
            orderQueueEl.innerHTML = '<p class="text-gray-400 text-center mt-4">ยังไม่มีออเดอร์ในคิว</p>';
            return;
        }
        
        orderQueueEl.innerHTML = '';
        let queueNumber = 1; 
        
        displayQueue.forEach(order => {
            // UPDATED: การสร้าง itemsSummary เพื่อรวมข้อมูลไข่มุก
            const itemsSummary = order.items.map(item => {
                let summary = `${item.name} (${item.size}, หวาน ${item.sweetness})`;
                // ตรวจสอบว่าเมนูมีตัวเลือกไข่มุกและลูกค้าเลือกรับหรือไม่
                if (item.addBubble) {
                    summary += ' + ไข่มุก';
                } else if (item.hasBubble && item.addBubble === false) {
                    summary += ' - ไม่รับไข่มุก';
                }
                return `${summary} x${item.quantity}`;
            }).join(', ');

            const statusColor = {
                'คิว': 'bg-blue-100 text-blue-800',
                'กำลังทำ': 'bg-yellow-100 text-yellow-800',
                'เสร็จแล้ว': 'bg-green-100 text-green-800',
                'ยกเลิก': 'bg-red-100 text-red-800'
            }[order.status];
            
            const isCompleted = order.status === 'เสร็จแล้ว' || order.status === 'ยกเลิก';
            
            let actionButtonsHtml = '';
            let orderHeader = `ออเดอร์ #${order.id.substring(0, 8)}...`;
            
            let notesDisplay = '';
            if (order.notes && order.notes.trim() !== '') {
                notesDisplay = `<p class="text-xs text-red-600 font-semibold mt-1">📝 หมายเหตุ: ${order.notes.trim()}</p>`;
            }
            
            let contactDisplay = '';
            if (order.contactInfo && order.contactInfo !== 'ไม่ระบุช่องทางติดต่อ') {
                 contactDisplay = `<p class="text-xs text-gray-800 font-semibold mt-1">📱 ติดต่อ: ${order.contactInfo}</p>`;
            } else {
                 contactDisplay = `<p class="text-xs text-red-500 font-semibold mt-1">🚫 ไม่ระบุช่องทางติดต่อ</p>`;
            }

            let sourceTagDisplay = '';
            let lineContactButton = ''; 

            if (isOwnerLoggedIn) {
                orderHeader = `คิวที่ #${queueNumber} | ออเดอร์ #${order.id.substring(0, 8)}...`;
                
                let contactLink = null;
                let buttonText = 'แชท Line';
                let buttonColor = 'bg-green-500 hover:bg-green-600';
                let iconSvg = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>`;

                if (order.contactInfo && order.contactInfo !== 'ไม่ระบุช่องทางติดต่อ') {
                    const contact = order.contactInfo.trim().replace(/-/g, '');
                    if (contact.match(/^0\d{9}$/) || contact.match(/^\d{9,10}$/)) { 
                        contactLink = `tel:${contact}`;
                        buttonText = '📞 โทรออก';
                        buttonColor = 'bg-blue-500 hover:bg-blue-600';
                        iconSvg = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>`;
                    }
                } 
                
                if (!contactLink) {
                    contactLink = `line://`; 
                    buttonText = 'แชท Line';
                }

                lineContactButton = `<button onclick="copyAndOpenLine('${order.id}', '${contactLink.replace(/'/g, "\\'")}', '${buttonText.replace(/'/g, "\\'")}')" 
                                             class="text-xs ${buttonColor} text-white font-bold py-1 px-3 rounded-lg flex items-center space-x-1">
                                             ${iconSvg}
                                             <span>${buttonText}</span>
                                          </button>`;
                
                if (order.status === 'คิว') {
                    actionButtonsHtml += `<button class="text-xs bg-yellow-400 hover:bg-yellow-500 text-white font-bold py-1 px-3 rounded-lg" onclick="updateOrderStatus('${order.id}', 'กำลังทำ')">รับออเดอร์</button>`;
                } else if (order.status === 'กำลังทำ') {
                    actionButtonsHtml += `<button class="text-xs bg-green-500 hover:bg-green-600 text-white font-bold py-1 px-3 rounded-lg" onclick="updateOrderStatus('${order.id}', 'เสร็จแล้ว')">เสร็จสิ้น</button>`;
                }
                if (!isCompleted) {
                     actionButtonsHtml += `<button class="text-xs bg-red-500 hover:bg-red-600 text-white font-bold py-1 px-3 rounded-lg" onclick="updateOrderStatus('${order.id}', 'ยกเลิก')">ยกเลิก</button>`;
                }

                if (order.sourceTag && order.sourceTag.trim() !== '') {
                    sourceTagDisplay = `<p class="text-xs text-purple-600 font-semibold mt-1">🔗 ที่มา: ${order.sourceTag.trim()}</p>`;
                }
            } else {
                orderHeader = `คิวที่ #${queueNumber} | ออเดอร์ #${order.id.substring(0, 8)}...`;
                contactDisplay = ''; 
            }
            
            if (!isCompleted) {
                queueNumber++;
            }

            const orderCard = document.createElement('div');
            orderCard.className = `p-4 rounded-lg shadow-sm ${isCompleted ? 'bg-gray-200 opacity-75' : 'bg-gray-50 hover:bg-white'}`;
            
            orderCard.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <h4 class="font-bold text-lg text-teal-700">${orderHeader}</h4> 
                        <p class="text-sm text-gray-600">${itemsSummary}</p>
                        ${contactDisplay} 
                        <p class="text-xs text-gray-500 mt-1">
                            <span class="font-semibold">ที่อยู่:</span> ${order.address}
                        </p>
                        ${notesDisplay}
                        ${sourceTagDisplay} 
                    </div>
                    <span class="text-lg font-bold text-teal-600">฿${order.total.toLocaleString('th-TH')}</span>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-sm font-semibold px-2.5 py-0.5 rounded-full ${statusColor}">${order.status}</span>
                    <div class="flex gap-2">
                        ${lineContactButton} 
                        ${actionButtonsHtml}
                    </div>
                </div>
            `;
            orderQueueEl.appendChild(orderCard);
        });
    }
    
    function updateOrderStatus(orderId, newStatus) {
        if (!isOwnerLoggedIn) {
            alert("ปฏิเสธ: คุณไม่มีสิทธิ์จัดการออเดอร์นี้ (กรุณา Login ด้วยสิทธิ์เจ้าของร้าน)");
            return;
        }
        
        const order = orderQueue.find(o => o.id === orderId);
        if (!order) return;

        const updateData = { status: newStatus };
        if (newStatus === 'เสร็จแล้ว') {
            updateData.completedAt = firebase.firestore.FieldValue.serverTimestamp();
            
            const batch = db.batch(); 
            order.items.forEach(item => {
                const newLogRef = db.collection("salesLog").doc();
                batch.set(newLogRef, {
                    name: item.name,
                    size: item.size,
                    sweetness: item.sweetness,
                    quantity: item.quantity,
                    price: item.price,
                    soldAt: updateData.completedAt,
                    orderId: orderId,
                    // NEW: เก็บข้อมูลไข่มุก
                    addBubble: item.addBubble || false 
                });
            });
            batch.commit().then(() => {
                console.log("Sales Log batch successfully written!");
            }).catch((error) => {
                console.error("Error writing sales log batch: ", error);
            });
        }
        
        db.collection("orders").doc(orderId).update(updateData)
            .then(() => console.log("Order status updated!"))
            .catch(error => console.error("Error updating order: ", error));
    }

    function updateSalesDashboard() {
        let salesToday = 0;
        
        menuSalesLog.forEach(log => {
            const saleDate = log.soldAt ? new Date(log.soldAt.seconds * 1000) : new Date();
            const totalRevenue = log.price * log.quantity;

            if (isToday(saleDate)) { salesToday += totalRevenue; }
        });
        
        document.getElementById('sales-today').textContent = `฿${salesToday.toLocaleString('th-TH')}`;
    }

    function showMenuReport() {
        if (!isOwnerLoggedIn) {
            alert("กรุณาเข้าสู่ระบบด้วยสิทธิ์เจ้าของร้านเพื่อดูรายงาน");
            return;
        }
        
        const menuSales = {};
        
        menuSalesLog.forEach(log => {
             // UPDATED: รวมไข่มุกใน key เพื่อแยกรายการที่มี/ไม่มีไข่มุก
            const bubbleStatus = log.addBubble ? ' + ไข่มุก' : (log.addBubble === false ? ' - ไม่รับไข่มุก' : '');
            const key = `${log.name} (${log.size}, หวาน ${log.sweetness})${bubbleStatus}`;
            if (!menuSales[key]) {
                menuSales[key] = { name: log.name, size: log.size, sweetness: log.sweetness, bubbleStatus: bubbleStatus, totalQuantity: 0, totalRevenue: 0 };
            }
            menuSales[key].totalQuantity += log.quantity;
            menuSales[key].totalRevenue += log.price * log.quantity;
        });
        
        const sortedMenuReport = Object.values(menuSales).sort((a, b) => b.totalQuantity - a.totalQuantity);
        let tableHTML = '<p class="text-gray-500 mb-4">สรุปยอดขายเมนูทั้งหมดที่ทำเสร็จสมบูรณ์ (นับตั้งแต่เปิดใช้ระบบ)</p>';
        if (sortedMenuReport.length === 0) {
            tableHTML += '<p class="text-center text-gray-400 mt-10">ยังไม่มีข้อมูลการขายที่เสร็จสมบูรณ์</p>';
        } else {
             tableHTML += `<table class="min-w-full divide-y divide-gray-200"><thead class="bg-teal-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">เมนู / ขนาด / ความหวาน</th><th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">จำนวน (แก้ว)</th><th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">รายได้รวม (฿)</th></tr></thead><tbody class="bg-white divide-y divide-gray-200">`;
             sortedMenuReport.forEach( (report, index) => {
                 // UPDATED: แสดงผลไข่มุก
                 const displayName = `${report.name} (${report.size}, หวาน ${report.sweetness})${report.bubbleStatus}`;
                 tableHTML += `<tr class="${index < 3 ? 'bg-yellow-50 font-semibold' : ''}"><td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${displayName}</td><td class="px-6 py-4 whitespace-nowrap text-sm text-right text-gray-900">${report.totalQuantity.toLocaleString('th-TH')}</td><td class="px-6 py-4 whitespace-nowrap text-sm text-right text-teal-600">${report.totalRevenue.toLocaleString('th-TH')}</td></tr>`;
             });
             tableHTML += '</tbody></table>';
        }
        document.getElementById('menu-report-content').innerHTML = tableHTML;
        document.getElementById('menu-report-modal').classList.remove('hidden');
    }

    // --- Initial setup ---
    orderSourceTag = getURLParameter('source_tag'); 
    if (orderSourceTag) {
        console.log(`Order source identified: ${orderSourceTag}`);
    }
    
    // Expose functions globally for inline HTML/JS calls (optional, but necessary for the existing structure)
    window.addToOrder = addToOrder;
    window.updateOrderItemQuantity = updateOrderItemQuantity;
    window.updateOrderItemSweetness = updateOrderItemSweetness;
    window.updateOrderItemSize = updateOrderItemSize;
    window.updateOrderItemBubble = updateOrderItemBubble; // NEW: Expose new function
    window.removeOrderItem = removeOrderItem;
    window.openOrderEntryModal = openOrderEntryModal;
    window.closeOrderEntryModal = closeOrderEntryModal;
    window.sendLineMessage = sendLineMessage;
    window.copyAndOpenLine = copyAndOpenLine;
    window.updateOrderStatus = updateOrderStatus;
    window.showMenuReport = showMenuReport;
    window.showMainContent = showMainContent;
    window.showOwnerLogin = showOwnerLogin;
    window.ownerLogin = ownerLogin;
    window.showImageUploadModal = showImageUploadModal;
    window.saveImageUrlToMenu = saveImageUrlToMenu;
    window.toggleCategory = toggleCategory; // Must be global for onclick

    renderMenu();
    initFirebaseListeners();
</script>
